# 海康摄像头 RTSP / 本地视频配置
camera:
  # 示例: rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101
  rtsp_url: ""
  # 本地视频路径（非空时优先于 rtsp_url），支持相对/绝对路径
  # 示例: "videos/test.mp4" 或 "E:/data/sample.mp4"
  video_file: "test.mp4"
  width: 1920
  height: 1080
  fps: 25
  # 本地视频播放结束后是否循环（Web 监控建议 true；CLI 可用 --source 覆盖）
  loop: true
  # RTSP 传输协议 tcp 更稳定
  rtsp_transport: tcp
  # 连续读帧失败多少次后重连（仅对流媒体生效）
  max_read_fails: 5
  reconnect_delay: 2

# YOLO 检测配置
detection:
  model: "yolov8n.pt"
  confidence: 0.5
  classes: [0]  # 0 = person
  imgsz: 640    # 推理分辨率，降低可提速（主码流 1080p 时建议 640）
  skip_frames: 0  # 每帧推理；设为 1 则跳过 1 帧读最新画面

# ByteTrack 跟踪配置
tracking:
  tracker: "bytetrack.yaml"
  persist: true

# 摄像机标定
# 先指定原点 O(0,0)，再标定多个点的相对地面坐标 (X, Y) 米
# 人物框显示相对原点的 X、Y；距离 D = sqrt(X²+Y²) 仍用于速度/靠近远离判断
# Web 或 calibrate.py: 先点 O，再点其他点并输入 (x, y)
calibration:
  homography_file: "config/homography_matrix.npy"

# 运动分析参数
motion:
  # 速度计算滑动窗口 (秒)
  speed_window_seconds: 1.0
  # 距离变化阈值 (米)，小于此值视为静止
  distance_threshold: 0.3
  # 方向判断需要连续满足的采样次数
  direction_confirm_frames: 5
  # 卡尔曼滤波过程噪声
  kalman_process_noise: 0.1
  kalman_measurement_noise: 1.0

# 输出配置
output:
  show_window: true
  save_video: false
  video_output: "output/result.mp4"
  json_output: "output/events.json"
