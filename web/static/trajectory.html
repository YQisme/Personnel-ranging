<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 人员轨迹 - 人员距离速度</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/trajectory.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="trajectory-page">
  <header>
    <div>
      <h1>3D 人员轨迹</h1>
      <p>地面坐标实时映射 · WebSocket · 真人模型轨迹</p>
    </div>
    <nav class="nav-tabs">
      <a href="/" class="nav-tab">标定</a>
      <a href="/monitor" class="nav-tab">实时监控</a>
      <a href="/trajectory" class="nav-tab active">3D 轨迹</a>
    </nav>
  </header>

  <div class="trajectory-layout">
    <div class="trajectory-main">
      <div class="toolbar">
        <button type="button" class="btn btn-primary" id="startBtn">开始检测</button>
        <button type="button" class="btn btn-danger" id="stopBtn" disabled>停止</button>
        <button type="button" class="btn" id="resetCamBtn">摄像头视角</button>
        <button type="button" class="btn" id="clearTrailBtn">清空轨迹</button>
        <label class="trail-toggle">
          <input type="checkbox" id="followCam" />
          跟随最近人员
        </label>
        <label class="trail-toggle" title="若与视频左右相反可勾选">
          <input type="checkbox" id="mirrorX" />
          镜像左右
        </label>
        <span id="fpsBadge" class="badge">FPS: -</span>
        <span id="detectBadge" class="badge">未运行</span>
      </div>

      <div id="messageBox" class="alert alert-error" hidden></div>

      <div id="viewport" class="viewport">
        <div id="viewportPlaceholder" class="placeholder viewport-placeholder">
          <p>点击「开始检测」加载 3D 场景</p>
          <p style="font-size:0.85rem;margin-top:8px">落点 = 摄像头地面直角坐标 (x, y)，单位米</p>
        </div>
        <img id="videoPip" class="video-pip" alt="监控画面" hidden>
      </div>
    </div>

    <aside class="sidebar">
      <h2>当前人员</h2>
      <ul id="personList" class="point-list">
        <li class="point-item" style="color:var(--text-muted)">暂无检测</li>
      </ul>

      <h2>坐标说明</h2>
      <ol class="steps">
        <li>原点 O = 摄像头正下方地面点</li>
        <li><strong>x</strong> = 横向（左负右正）</li>
        <li><strong>y</strong> = 纵深（沿摄像头主视野）</li>
        <li>人员落点用 (x, y)，不是极径距离 D</li>
        <li>3D 中水平面：X→x，Z→y</li>
        <li>右下角可对照实时监控画面</li>
      </ol>
    </aside>
  </div>

  <script type="module" src="/static/trajectory.js"></script>
</body>
</html>
